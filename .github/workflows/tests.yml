name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile server.py tests/test_local_security.py
      - name: Run local-security tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate browser JavaScript syntax
        run: node --check static/app.js
